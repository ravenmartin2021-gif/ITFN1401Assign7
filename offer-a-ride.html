<header>

    <nav>

<main>
    <h2>Offer a Ride</h2>
    <p>Have an extra seat? Share your ride with another student.</p>

    <form>
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="start">Starting Location:</label>
        <input type="text" id="start" name="start" required>

        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination" required>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>

        <label for="time">Time:</label>
        <input type="time" id="time" name="time" required>

        <label for="seats">Open Seats:</label>
        <input type="number" id="seats" name="seats" min="1" required>

        <button type="submit">Post Ride</button>
    </form>
</main>

<footer>
    <p>Contact us: studentride@example.com</p>
    <p>Assignment Due Date: November 1, 2026</p>
    <div id="lastModified"></div>
</footer>
