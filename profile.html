    <nav>

        </ul>

<main>
    <h2>My Profile</h2>
    <p>Enter your information below.</p>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="school">School:</label>
        <input type="text" id="school" name="school" required>

        <p>Are you a passenger or driver?</p>

        <input type="radio" id="passenger" name="account" value="passenger">
        <label for="passenger">Passenger</label>

        <input type="radio" id="driver" name="account" value="driver">
        <label for="driver">Driver</label>

        <br><br>
        <button type="submit">Save Profile</button>
    </form>
</main>

<footer>
    <p>Contact us: studentride@example.com</p>
    <p>Assignment Due Date: November 1, 2026</p>
    <div id="lastModified"></div>
</footer>
